name: Build Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Configure Gradle Java Home
        run: echo "org.gradle.java.home=${{ env.JAVA_HOME }}" >> gradle.properties

      - name: Install Gradle 8.12.1
        run: |
          wget https://services.gradle.org/distributions/gradle-8.12.1-bin.zip
          unzip -q gradle-8.12.1-bin.zip
          echo "$PWD/gradle-8.12.1/bin" >> $GITHUB_PATH

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: examplemod-jar
          path: build/libs/*.jar
